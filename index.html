<!DOCTYPE html>
<html lang="en-us">
  <head>
    <!-- Panic Button -->
<a href="https://vle.learning.moe.edu.sg" id="panicBtn">
  panic button
</a>

<style>
  #panicBtn {
    position: fixed;          
    top: 80px;                
    left: 20px;               
    z-index: 9999;            
            
    padding: 20px 40px;        /* BIGGER click area */
    background-color: #0066cc; /* blue */
    color: #ffeb3b;            /* yellow */
    text-decoration: none;
    font-weight: bold;
    font-size: 9px;            /* small text */
    border-radius: 8px;
    
    font-family: Arial, sans-serif;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    
    display: inline-block;     /* ensures padding works properly */
    transition: 0.2s ease;
  }

  #panicBtn:hover {
    background-color: #004c99;
    transform: scale(1.05);
  }
</style>

    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Tanuki Sunset</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/WebGL.json", {onProgress: UnityProgress});
    </script>
  </head>
  <body>
    <div class="webgl-content">
      <div id="gameContainer" style="width: 960px; height: 600px"></div>
      <div class="footer">
        <div class="webgl-logo"></div>
        <div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
        <div class="title">Tanuki Sunset</div>
      </div>
    </div>
  </body>
</html>
